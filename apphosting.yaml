# Firebase App Hosting Configuration for Tamil Nadu Startup Connect
# Documentation: https://firebase.google.com/docs/app-hosting/configure

kind: "AppHosting"
schemaVersion: "v1"

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NODE_ENV
    value: "production"
  - variable: PORT
    value: "8080"
  - variable: DATABASE_URL
    value: "postgresql://postgres.ajdhxuqpkwjbcbjxrwed:Tn_startup_mapss@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?pgbouncer=true"
    availability:
      - RUN
  - variable: DIRECT_URL
    value: "postgresql://postgres.ajdhxuqpkwjbcbjxrwed:Tn_startup_mapss@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres"
    availability:
      - BUILD
      - RUN
  - variable: JWT_SECRET
    value: "tn_startup_map_enterprise_jwt_secret_key_2026_super_secure"
    availability:
      - RUN
