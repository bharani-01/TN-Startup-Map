<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Tamil Nadu Startup Connect — Innovation &amp; Venture Directory</title>
    <meta name="description" content="Explore startups, founders, investors, incubators, jobs, and the innovation ecosystem across Tamil Nadu's 38 districts." />
    <meta name="keywords" content="Tamil Nadu startups, TN startup ecosystem, Chennai startups, Coimbatore startups, founders, incubators, investors, innovation, ventures" />
    <meta name="author" content="Tamil Nadu Startup Connect" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tnstartupmaps.trackifyapp.co.in/" />
    
    <!-- Apple & Browser Theme -->
    <meta name="theme-color" content="#F5F5F7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tamil Nadu Startup Connect" />
    <meta property="og:title" content="Tamil Nadu Startup Connect — Innovation & Venture Directory" />
    <meta property="og:description" content="Explore startups, founders, investors, incubators, jobs, and the innovation ecosystem across Tamil Nadu's 38 districts." />
    <meta property="og:url" content="https://tnstartupmaps.trackifyapp.co.in/" />
    <meta property="og:image" content="https://tnstartupmaps.trackifyapp.co.in/logo.webp" />
    <meta property="og:image:secure_url" content="https://tnstartupmaps.trackifyapp.co.in/logo.webp" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Tamil Nadu Startup Connect Logo" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@tnstartupmap" />
    <meta name="twitter:creator" content="@tnstartupmap" />
    <meta name="twitter:title" content="Tamil Nadu Startup Connect — Innovation & Venture Directory" />
    <meta name="twitter:description" content="Explore startups, founders, investors, incubators, jobs, and the innovation ecosystem across Tamil Nadu's 38 districts." />
    <meta name="twitter:image" content="https://tnstartupmaps.trackifyapp.co.in/logo.webp" />
    <meta name="twitter:image:alt" content="Tamil Nadu Startup Connect Logo" />

    <!-- Google Fonts: Syne, Instrument Serif, Outfit, Sora, Manrope, Plus Jakarta Sans, Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <!-- Critical: Prevent blank white flash before React hydrates -->
    <style>
      html, body { margin: 0; padding: 0; background-color: #f5f5f7; }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      #root:empty::after {
        content: '';
        width: 36px;
        height: 36px;
        border: 3px solid #1d1d1f;
        border-top-color: transparent;
        border-radius: 50%;
        animation: __app_spin 0.7s linear infinite;
      }
      @keyframes __app_spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#f8fafc] text-slate-900 font-sans antialiased selection:bg-brand-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
